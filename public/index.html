<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>怀古 · 千载风流一图寻</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='6' y='6' width='52' height='52' rx='6' fill='%23a8322d'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='%23f3ead8' font-family='serif'>古</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- 全局 SVG 滤镜：宣纸纹理、水墨毛边 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="ink-rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" />
      </filter>
      <filter id="ink-blur"><feGaussianBlur stdDeviation="6" /></filter>
      <filter id="ink-blur-lg"><feGaussianBlur stdDeviation="18" /></filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
  </svg>

  <div class="paper-grain" aria-hidden="true"></div>
  <main id="app"></main>
  <div id="veil" class="veil" aria-hidden="true"><div class="veil-ink"></div><div class="veil-text"></div></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
